<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pocket Vyley</title>
    <link rel="icon" type="image/png" href="../favicon.png">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="page">
        <div class="window">
            <div class="window-header">
                <div class="dots">
                    <div class="dot red"></div>
                    <div class="dot yellow"></div>
                    <div class="dot green"></div>
                </div>
                <div class="window-title">visitor@vivian:~/kotka$</div>
                <a class="back" href="../">cd ..</a>
            </div>

            <div class="content">
                <section class="device-col">
                    <div class="device">
                        <div class="device-brand">POCKET&nbsp;VYLEY</div>
                        <div class="device-sub">aspect of twilight</div>
                        <div class="screen" id="screen">
                            <div class="screen-top">
                                <span id="screen-level">Lv 1</span>
                                <span id="screen-clock">--:--</span>
                            </div>

                            <div class="stage" id="stage">
                                <div class="stars" aria-hidden="true"></div>
                                <div class="moon" aria-hidden="true"></div>
                                <div class="ground" aria-hidden="true"></div>
                                <div class="clutter" id="clutter"></div>
                                <div class="speech" id="speech" role="status" aria-live="polite"></div>
                                <div class="laser" id="laser" hidden></div>
                                <div class="laser-hud" id="laser-hud" hidden></div>

                                <div class="pet" id="pet" title="pet the kotka :3">
                                    <svg class="kitty" id="kitty" data-mood="content" data-acc="none" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" aria-label="Vyley, a twilight kitty">
                                        <defs>
                                            <radialGradient id="aura-glow">
                                                <stop offset="0%" stop-color="#ffd9a0" stop-opacity="0.55"/>
                                                <stop offset="60%" stop-color="#c4b5fd" stop-opacity="0.2"/>
                                                <stop offset="100%" stop-color="#c4b5fd" stop-opacity="0"/>
                                            </radialGradient>
                                        </defs>
                                        <circle class="form-aura" cx="50" cy="58" r="46" fill="url(#aura-glow)"/>
                                        <ellipse class="shadow" cx="50" cy="94" rx="27" ry="3.5"/>
                                        <g class="bob">
                                            <g class="tail">
                                                <path class="tail-fur" d="M68 84 C84 84 90 72 86 60 C84 54 88 48 92 47"/>
                                                <path class="tail-star" d="M92 41.5 L93.4 45.6 L97.5 47 L93.4 48.4 L92 52.5 L90.6 48.4 L86.5 47 L90.6 45.6 Z"/>
                                            </g>
                                            <ellipse class="fur" cx="50" cy="76" rx="22" ry="16"/>
                                            <ellipse class="belly" cx="50" cy="79" rx="11" ry="10"/>
                                            <ellipse class="paw" cx="41" cy="89" rx="6.5" ry="4"/>
                                            <ellipse class="paw" cx="59" cy="89" rx="6.5" ry="4"/>

                                            <g class="ear ear-left">
                                                <path class="fur" d="M27 42 L29 15 L46 31 Z"/>
                                                <path class="ear-in" d="M30.5 36 L31.5 21 L41 30.5 Z"/>
                                            </g>
                                            <g class="ear ear-right">
                                                <path class="fur" d="M73 42 L71 15 L54 31 Z"/>
                                                <path class="ear-in" d="M69.5 36 L68.5 21 L59 30.5 Z"/>
                                            </g>
                                            <ellipse class="fur" cx="50" cy="50" rx="27" ry="22"/>
                                            <ellipse class="shine" cx="37" cy="38" rx="7" ry="3.5" transform="rotate(-25 37 38)"/>
                                            <g class="form-tufts">
                                                <path d="M43 30 L45.5 23.5 L48 29.5 L50.5 22 L53 29.5 L55.5 24 L57.5 30 Z"/>
                                                <path d="M24 49 L17 46.5 L22.5 52 L16.5 54.5 L24 56 Z"/>
                                                <path d="M76 49 L83 46.5 L77.5 52 L83.5 54.5 L76 56 Z"/>
                                            </g>
                                            <path class="crescent" d="M50 29.5 A4.5 4.5 0 1 0 54.6 35.6 A3.6 3.6 0 1 1 50 29.5 Z"/>
                                            <ellipse class="cheek" cx="32" cy="58" rx="4.5" ry="2.6"/>
                                            <ellipse class="cheek" cx="68" cy="58" rx="4.5" ry="2.6"/>
                                            <g class="whiskers">
                                                <path d="M29 55 L16 53"/><path d="M29 58.5 L16 59.5"/>
                                                <path d="M71 55 L84 53"/><path d="M71 58.5 L84 59.5"/>
                                            </g>

                                            <g class="face eyes-open">
                                                <g class="eye"><ellipse cx="40" cy="50" rx="3.6" ry="4.8"/><circle class="glint" cx="41.3" cy="48.3" r="1.3"/></g>
                                                <g class="eye"><ellipse cx="60" cy="50" rx="3.6" ry="4.8"/><circle class="glint" cx="61.3" cy="48.3" r="1.3"/></g>
                                            </g>
                                            <g class="face eyes-happy">
                                                <path d="M36 51 Q40 45.5 44 51"/>
                                                <path d="M56 51 Q60 45.5 64 51"/>
                                            </g>
                                            <g class="face eyes-sleep">
                                                <path d="M36 50 Q40 53.5 44 50"/>
                                                <path d="M56 50 Q60 53.5 64 50"/>
                                            </g>
                                            <g class="face eyes-sad">
                                                <ellipse cx="40" cy="51" rx="3" ry="3.8"/>
                                                <ellipse cx="60" cy="51" rx="3" ry="3.8"/>
                                                <path d="M35 46.5 L43 44"/>
                                                <path d="M65 46.5 L57 44"/>
                                            </g>
                                            <g class="face eyes-think">
                                                <ellipse cx="41.5" cy="47.5" rx="3.4" ry="4.4"/>
                                                <ellipse cx="61.5" cy="47.5" rx="3.4" ry="4.4"/>
                                            </g>
                                            <g class="face eyes-grump">
                                                <path d="M35.5 49.5 L44 49.5"/>
                                                <path d="M56 49.5 L64.5 49.5"/>
                                            </g>

                                            <path class="nose" d="M47.6 56 L52.4 56 L50 58.8 Z"/>
                                            <path class="face mouth-smile" d="M45 60 Q47.5 63 50 60 Q52.5 63 55 60"/>
                                            <path class="face mouth-open" d="M45.5 60 Q50 68.5 54.5 60 Z"/>
                                            <path class="face mouth-flat" d="M46.5 61.5 L53.5 61.5"/>
                                            <path class="face mouth-frown" d="M46 63.5 Q50 60 54 63.5"/>
                                            <ellipse class="face mouth-o" cx="50" cy="62" rx="2" ry="2.5"/>

                                            <g class="form-stars">
                                                <path d="M14 30 L15 32.6 L17.6 33.5 L15 34.4 L14 37 L13 34.4 L10.4 33.5 L13 32.6 Z"/>
                                                <path d="M86 22 L86.8 24.2 L89 25 L86.8 25.8 L86 28 L85.2 25.8 L83 25 L85.2 24.2 Z"/>
                                                <path d="M10 70 L10.7 71.8 L12.5 72.5 L10.7 73.2 L10 75 L9.3 73.2 L7.5 72.5 L9.3 71.8 Z"/>
                                            </g>

                                            <!-- wardrobe -->
                                            <g class="acc acc-bow">
                                                <path d="M64 24 L58 19 L58 29 Z M64 24 L70 19 L70 29 Z"/>
                                                <circle cx="64" cy="24" r="2.2"/>
                                            </g>
                                            <g class="acc acc-glasses">
                                                <rect x="33.5" y="44" width="13" height="11" rx="4"/>
                                                <rect x="53.5" y="44" width="13" height="11" rx="4"/>
                                                <path d="M46.5 49 Q50 47 53.5 49"/>
                                            </g>
                                            <g class="acc acc-headphones">
                                                <path class="band" d="M24 46 C24 18 76 18 76 46"/>
                                                <rect x="19" y="40" width="9" height="16" rx="4"/>
                                                <rect x="72" y="40" width="9" height="16" rx="4"/>
                                            </g>
                                            <g class="acc acc-beanie">
                                                <path d="M25 35 C27 14 73 14 75 35 Z"/>
                                                <rect class="rim" x="23" y="31" width="54" height="7" rx="3.5"/>
                                                <circle class="pom" cx="50" cy="13" r="4.5"/>
                                            </g>
                                            <g class="acc acc-scarf">
                                                <path d="M30 66 Q50 74 70 66 L70 71 Q50 79 30 71 Z"/>
                                                <path d="M60 70 L63 84 L56 84 L54 72 Z"/>
                                            </g>
                                            <g class="acc acc-martenitsa">
                                                <path class="red" d="M33 27 Q31 33 32 40"/>
                                                <path class="white" d="M35 27 Q37 33 36.5 40"/>
                                                <circle class="red" cx="32" cy="41.5" r="2.4"/>
                                                <circle class="white" cx="36.5" cy="41.5" r="2.4"/>
                                                <circle class="knot" cx="34" cy="27" r="1.6"/>
                                            </g>
                                            <g class="acc acc-flowers">
                                                <circle cx="32" cy="30" r="3.2" class="f1"/><circle cx="40" cy="27" r="3.2" class="f2"/>
                                                <circle cx="50" cy="26" r="3.2" class="f3"/><circle cx="60" cy="27" r="3.2" class="f1"/>
                                                <circle cx="68" cy="30" r="3.2" class="f2"/>
                                            </g>
                                            <g class="acc acc-collar">
                                                <path class="band" d="M31 67 Q50 74 69 67 L69 71 Q50 78 31 71 Z"/>
                                                <circle class="bell" cx="50" cy="76" r="3.4"/>
                                                <path class="slit" d="M48.6 77.2 L51.4 77.2"/>
                                            </g>
                                            <g class="acc acc-sunglasses">
                                                <rect x="33" y="45" width="14" height="9" rx="3"/>
                                                <rect x="53" y="45" width="14" height="9" rx="3"/>
                                                <path class="bridge" d="M47 48 L53 48"/>
                                                <path class="shine" d="M36 47 L39 47 M56 47 L59 47"/>
                                            </g>
                                            <g class="acc acc-bandana">
                                                <path d="M31 66 Q50 73 69 66 L50 85 Z"/>
                                                <circle cx="44" cy="72" r="1"/><circle cx="56" cy="72" r="1"/><circle cx="50" cy="78" r="1"/>
                                            </g>
                                            <g class="acc acc-chef">
                                                <rect x="39" y="19" width="22" height="10" rx="2"/>
                                                <circle cx="41" cy="17" r="7"/><circle cx="50" cy="12" r="8"/><circle cx="59" cy="17" r="7"/>
                                                <path class="fold" d="M39 24 L61 24"/>
                                            </g>
                                            <g class="acc acc-party">
                                                <path class="cone" d="M41 30 L50 5 L59 30 Z"/>
                                                <path class="stripe" d="M44.5 21 L55.5 21 M47.2 13.5 L52.8 13.5"/>
                                                <circle class="pom" cx="50" cy="5" r="2.8"/>
                                            </g>
                                            <g class="acc acc-witch">
                                                <path class="hat" d="M37 29 Q45 20 49 3 Q55 18 63 29 Z"/>
                                                <ellipse class="hat" cx="50" cy="29" rx="23" ry="4"/>
                                                <path class="band" d="M38.5 25.5 Q50 28 61.5 25.5 L62.5 28 Q50 30.5 37.5 28 Z"/>
                                                <path class="star" d="M51 12 L52 14.6 L54.6 15.5 L52 16.4 L51 19 L50 16.4 L47.4 15.5 L50 14.6 Z"/>
                                            </g>
                                            <g class="acc acc-rose">
                                                <ellipse class="leaf" cx="63" cy="33" rx="4" ry="1.8" transform="rotate(-30 63 33)"/>
                                                <circle class="petal" cx="68" cy="29" r="4.4"/>
                                                <circle class="inner" cx="68" cy="29" r="2.3"/>
                                            </g>
                                            <g class="acc acc-propeller">
                                                <path class="cap" d="M37 30 Q50 14 63 30 Z"/>
                                                <path class="seg" d="M50 30 L50 19.5 M43 27 Q46 21 50 19.5 M57 27 Q54 21 50 19.5"/>
                                                <path class="stick" d="M50 19.5 L50 14"/>
                                                <g class="blades"><ellipse cx="50" cy="13" rx="8" ry="1.7"/></g>
                                            </g>
                                            <g class="acc acc-crown">
                                                <path d="M37 27 L39 15 L45 22 L50 12 L55 22 L61 15 L63 27 Z"/>
                                                <circle cx="50" cy="20" r="1.8" class="gem"/>
                                            </g>
                                        </g>
                                    </svg>
                                </div>

                                <div class="away" id="away" hidden>
                                    <div class="away-icon">🐾</div>
                                    <div class="away-title" id="away-title">Out on a task</div>
                                    <div class="away-bar"><div class="away-fill" id="away-fill"></div></div>
                                    <div class="away-time" id="away-time">00:00</div>
                                </div>
                            </div>
                        </div>
                        <div class="device-buttons" aria-hidden="true">
                            <span></span><span></span><span></span>
                        </div>
                    </div>

                    <div class="actions" id="actions">
                        <button data-action="feed">🥐 feed</button>
                        <button data-action="play">🧶 play</button>
                        <button data-action="sleep" id="sleep-btn">💤 nap</button>
                        <button data-action="groom">🪮 groom</button>
                        <button data-action="tasks" class="wide" id="tasks-btn">💻 assign a ticket</button>
                        <button data-action="wardrobe" class="half">🎀 wardrobe</button>
                        <button data-action="trophies" class="half">🏆 trophies</button>
                    </div>
                </section>

                <section class="panel-col">
                    <div class="panel">
                        <div class="panel-head">
                            <span class="name">Vyley</span>
                            <span class="title" id="level-title">Dusk Kitten</span>
                        </div>
                        <div class="stat" data-stat="food">
                            <label>snacks</label><div class="bar"><div class="fill"></div></div><span class="val">100</span>
                        </div>
                        <div class="stat" data-stat="energy">
                            <label>energy</label><div class="bar"><div class="fill"></div></div><span class="val">100</span>
                        </div>
                        <div class="stat" data-stat="tidy">
                            <label>tidiness</label><div class="bar"><div class="fill"></div></div><span class="val">100</span>
                        </div>
                        <div class="stat" data-stat="joy">
                            <label>joy</label><div class="bar"><div class="fill"></div></div><span class="val">100</span>
                        </div>
                        <div class="stat xp">
                            <label id="level-label">lv 1</label><div class="bar"><div class="fill" id="xp-fill"></div></div><span class="val" id="xp-val">0/70</span>
                        </div>
                        <div class="meta">
                            <span>age <b id="age">0m</b></span>
                            <span>tickets <b id="tasks-done">0</b></span>
                            <span>trophies <b id="trophy-count">0</b></span>
                        </div>
                        <div class="meta">
                            <span>stage <b id="stage-name">kitten</b></span>
                            <span>care mistakes <b id="mistakes">0</b></span>
                            <span>health <b id="health">healthy</b></span>
                        </div>
                    </div>

                    <div class="log-wrap">
                        <div class="log-head">~/kotka/activity.log</div>
                        <div class="log" id="log"></div>
                    </div>

                    <button class="reset" id="reset">rm -rf ./kotka (start over)</button>
                </section>
            </div>
        </div>
    </div>

    <dialog class="modal" id="modal">
        <form method="dialog">
            <div class="modal-head">
                <span id="modal-title"></span>
                <button class="close" value="close" aria-label="Close">esc</button>
            </div>
            <div class="modal-body" id="modal-body"></div>
        </form>
    </dialog>

    <script src="script.js"></script>
</body>
</html>
